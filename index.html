<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teconnect — Central de RH</title>
  <meta name="description" content="Teconnect — Central de gestão de recursos humanos">
</head>
<body>
  <div id="teconnect-loading" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh;background:#0b1220;color:#fff;padding:24px;text-align:center">A carregar Teconnect…</div>
  <script>
  (async () => {
    try {
      const response = await fetch('/legacy.html?rebrand=teconnect', { cache: 'no-store' });
      if (!response.ok) throw new Error('Falha ao carregar a aplicação base (' + response.status + ')');
      let html = await response.text();

      // Rebrand the complete application at runtime so the existing production app,
      // including its embedded CSS/JS, keeps working without duplicating the 1 MB bundle.
      html = html.replace(/MMConnect/gi, 'Teconnect');
      html = html.replace(/mmconnectapp/gi, 'teconnect');
      html = html.replace(/mmconnect/gi, 'teconnect');

      // Replace the embedded old logo image with a clean Teconnect SVG logo.
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120"><rect width="320" height="120" rx="24" fill="#111827"/><circle cx="55" cy="60" r="30" fill="#fff"/><path d="M42 60h26M55 47v26" stroke="#111827" stroke-width="8" stroke-linecap="round"/><text x="98" y="68" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Teconnect</text></svg>';
      const logoData = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
      html = html.replace(/src=["']data:image\/png;base64,[^"']+["']/gi, 'src="' + logoData + '"');

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.getElementById('teconnect-loading').innerHTML = '<strong>Teconnect</strong><br><span style="opacity:.75">Não foi possível carregar a aplicação.</span>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
